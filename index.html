<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kemiprovet">
<title>Kemiprovet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: en kolumn, labbokskänsla; koppar som accent (ledare, rost), kall grå papperston. */
:root{
  --bg:#F5F6F4; --card:#FFFFFF; --fg:#1E2327; --mute:#5E6A72; --line:#D5DAD8;
  --accent:#B5602E; --accent-ink:#FFFFFF; --ok:#1E7A4C; --ok-bg:#E4F2EA; --bad:#B8322C; --bad-bg:#F9E6E4;
  --lock:#EEF0EE; --tint:#EEF3F1;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171B1E; --card:#21262A; --fg:#ECEFEA; --mute:#9BA6AC; --line:#38414A;
  --accent:#D98C5A; --accent-ink:#1A1410; --ok:#6CCB95; --ok-bg:#1E3A2C; --bad:#F08A84; --bad-bg:#432422;
  --lock:#1C2124; --tint:#262D31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171B1E; --card:#21262A; --fg:#ECEFEA; --mute:#9BA6AC; --line:#38414A;
  --accent:#D98C5A; --accent-ink:#1A1410; --ok:#6CCB95; --ok-bg:#1E3A2C; --bad:#F08A84; --bad-bg:#432422;
  --lock:#1C2124; --tint:#262D31; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 40px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}
.eyebrow{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--mute)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-family:var(--display);min-height:48px}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 14px}
.top .back{color:var(--mute);font-weight:600}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.list{display:grid;gap:10px;margin-top:14px}
.area{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.area.locked{background:var(--lock);color:var(--mute)}
.area .num{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent)}
.area.locked .num{color:var(--mute)}
.area .t{font-weight:600;line-height:1.25}
.area .s{font-size:14px;color:var(--mute)}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--tint);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.read p,.read li{max-width:60ch}
.read table{border-collapse:collapse;width:100%;margin:10px 0;font-size:16px}
.read th,.read td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.read th{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.read .ex{background:var(--tint);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.read ul,.read ol{padding-left:22px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.qtext{font-size:21px;font-weight:600;line-height:1.3;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:18px;line-height:1.3;min-height:52px}
.opt b{font-family:var(--display);color:var(--mute)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--tint)}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.fb b{font-family:var(--display)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat div{padding:10px 12px;border-radius:10px;background:var(--tint)}
.stat small{display:block;color:var(--mute);font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.grid button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--tint)}.grid button.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid button.r{background:var(--ok-bg);border-color:var(--ok)}.grid button.w{background:var(--bad-bg);border-color:var(--bad)}
.tiny{font-size:14px;color:var(--mute)}
.link{color:var(--accent);font-weight:600;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="data" type="application/json">{"areas": [{"id": 1, "title": "Atomen – materiens minsta byggsten", "short": "Atomen", "text": "\n<p>Allt omkring oss består av <b>materia<\/b>. Materia är sådant som har massa och tar plats: vatten, luft, stenar, trä och våra kroppar. Materia är uppbyggd av <b>atomer<\/b>, som är så små att vi inte kan se dem med blotta ögat.<\/p>\n<p>En atom har en <b>kärna<\/b> i mitten och <b>elektroner<\/b> som rör sig runt kärnan. I kärnan finns två sorters partiklar.<\/p>\n<table><tr><th>Partikel<\/th><th>Var?<\/th><th>Laddning<\/th><\/tr>\n<tr><td>Proton<\/td><td>I kärnan<\/td><td>Positiv (+)<\/td><\/tr>\n<tr><td>Neutron<\/td><td>I kärnan<\/td><td>Ingen (0)<\/td><\/tr>\n<tr><td>Elektron<\/td><td>Runt kärnan<\/td><td>Negativ (−)<\/td><\/tr><\/table>\n<p>En vanlig atom är <b>elektriskt neutral<\/b>: den har lika många protoner som elektroner, så plus och minus tar ut varandra.<\/p>\n<p>När två eller flera atomer sitter ihop med kemiska bindningar kallas det en <b>molekyl<\/b>. En vattenmolekyl består av två väteatomer och en syreatom, därför skrivs vatten H₂O.<\/p>\n<div class=\"ex\"><b>Fundera:<\/b> Luft syns inte. Är den ändå materia? Ja. Blås upp en ballong: den blir större eftersom luften tar plats, och den väger lite mer eftersom luften har massa.<\/div>\n"}, {"id": 2, "title": "Atomnummer, atommassa och isotoper", "short": "Atomnummer", "text": "\n<p>Tre begrepp är lätta att blanda ihop. Håll isär dem så här:<\/p>\n<ul>\n<li><b>Atomnummer<\/b> = antalet <b>protoner<\/b> i kärnan. Det avgör vilket grundämne atomen är. Alla atomer med 6 protoner är kol, alla med 8 är syre.<\/li>\n<li><b>Masstal<\/b> = antalet protoner <b>plus<\/b> neutroner i kärnan.<\/li>\n<li><b>Atommassa<\/b> = medelvärdet av massan för grundämnets naturliga isotoper, uttryckt i enheten u. Därför är atommassan sällan ett jämnt heltal.<\/li>\n<\/ul>\n<p><b>Isotoper<\/b> är varianter av samma grundämne. De har lika många protoner men olika många neutroner, och väger därför olika mycket.<\/p>\n<div class=\"ex\"><b>Exempel:<\/b> Kol-12 har 6 protoner och 6 neutroner (masstal 12). Kol-14 har 6 protoner och 8 neutroner (masstal 14). Båda är kol, eftersom båda har 6 protoner.<\/div>\n<p>Minnesregel: <b>protonerna bestämmer ämnet, neutronerna bestämmer isotopen.<\/b><\/p>\n"}, {"id": 3, "title": "Elektronskal och valenselektroner", "short": "Elektronskal", "text": "\n<p>Elektronerna ligger i <b>skal<\/b> runt kärnan. Skalen fylls inifrån och ut.<\/p>\n<ul>\n<li><b>K-skalet<\/b> är innerst och rymmer högst <b>2<\/b> elektroner.<\/li>\n<li><b>L-skalet<\/b> är nästa och rymmer högst <b>8<\/b> elektroner i den förenklade modellen.<\/li>\n<\/ul>\n<p>Elektronerna i det <b>yttersta<\/b> skalet kallas <b>valenselektroner<\/b>. De är de viktigaste i kemin, eftersom det är de som deltar i reaktioner. Antalet valenselektroner avgör hur atomen reagerar med andra atomer.<\/p>\n<div class=\"ex\"><b>Exempel:<\/b> Natrium har 11 elektroner: 2 i K-skalet, 8 i L-skalet och 1 i det yttersta. Natrium har alltså <b>en<\/b> valenselektron och lämnar gärna ifrån sig den. Klor har <b>sju<\/b> valenselektroner och vill gärna ta upp en till för att få fullt skal. När natrium ger sin elektron till klor bildas joner som dras till varandra.<\/div>\n"}, {"id": 4, "title": "Periodiska systemet", "short": "Periodiska systemet", "text": "\n<p>Det periodiska systemet är en tabell över alla grundämnen. Varje grundämne har en egen ruta.<\/p>\n<ul>\n<li><b>Period<\/b> = en <b>vågrät rad<\/b>. Ämnen i samma period har lika många elektronskal (period 1 har ett skal, period 3 har tre).<\/li>\n<li><b>Grupp<\/b> = en <b>lodrät kolumn<\/b>. Ämnen i samma grupp har lika många valenselektroner och liknar därför varandra kemiskt.<\/li>\n<\/ul>\n<p><b>Grupp 1 – alkalimetaller<\/b> (litium, natrium). En valenselektron. Lämnar lätt ifrån sig den och bildar positiva joner (+1). Mjuka, reaktiva metaller som leder värme och ström bra och reagerar kraftigt med vatten.<\/p>\n<p><b>Grupp 17 – halogener<\/b> (fluor, klor). Sju valenselektroner. Saknar bara en elektron för fullt skal, tar därför lätt upp en och bildar negativa joner (−1). Reagerar kraftigt med metaller och bildar salter. Finns som tvåatomiga molekyler i rent tillstånd: F₂, Cl₂, Br₂, I₂. Giftiga icke-metaller.<\/p>\n<p><b>Grupp 18 – ädelgaser<\/b> (helium, neon). Fullt yttersta skal (2 för helium, 8 för övriga). Mycket stabila, reagerar nästan aldrig. Färglösa, luktfria gaser som finns som fria enskilda atomer, inte som molekyler.<\/p>\n<div class=\"ex\"><b>Jämföra:<\/b> Väte och helium ligger båda i period 1 (ett skal). Väte har 1 elektron, helium 2. Helium har fullt skal och är därför mycket stabilare.<br>Natrium och klor ligger båda i period 3 (tre skal). Natrium har 1 valenselektron och lämnar gärna den, klor har 7 och tar gärna upp en. Tillsammans bildar de natriumklorid, vanligt bordssalt.<\/div>\n"}, {"id": 5, "title": "Joner – när atomer får laddning", "short": "Joner", "text": "\n<p>En <b>jon<\/b> är en atom (eller grupp av atomer) som har fått elektrisk laddning genom att ta upp eller lämna ifrån sig elektroner. Antalet protoner ändras aldrig; det är elektronerna som flyttas.<\/p>\n<ul>\n<li>Lämnar atomen ifrån sig elektroner finns det fler protoner än elektroner: jonen blir <b>positiv<\/b>.<\/li>\n<li>Tar atomen upp elektroner finns det fler elektroner än protoner: jonen blir <b>negativ<\/b>.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exempel:<\/b> Natrium lämnar en elektron → Na⁺. Klor tar upp en elektron → Cl⁻. Motsatta laddningar dras till varandra, och natriumjoner och kloridjoner bildar saltet natriumklorid, NaCl.<\/div>\n<p>Minnesregel: <b>Förlorar elektroner = positiv. Tar upp elektroner = negativ.<\/b><\/p>\n<p>Metaller har få valenselektroner och bildar positiva joner. Icke-metaller som halogener har många och bildar negativa joner.<\/p>\n"}, {"id": 6, "title": "De tre typerna av kemiska bindningar", "short": "Bindningar", "text": "\n<p>En kemisk bindning håller ihop atomer eller joner. Du ska kunna tre typer.<\/p>\n<p><b>Jonbindning.<\/b> En positiv jon och en negativ jon dras till varandra. Vanlig mellan <b>metall och icke-metall<\/b>. Exempel: natriumklorid, NaCl.<\/p>\n<p><b>Kovalent bindning<\/b> (elektronparbindning). Atomerna <b>delar<\/b> på ett eller flera elektronpar. Vanlig mellan <b>icke-metaller<\/b>. Exempel: vätgas H₂ och vatten H₂O.<\/p>\n<p><b>Metallbindning.<\/b> Positiva metalljoner hålls ihop av elektroner som kan röra sig fritt genom hela metallen, som ett \"elektronhav\". Exempel: koppar och järn. De rörliga elektronerna är orsaken till att metaller leder ström.<\/p>\n<div class=\"ex\"><b>Vad avgör bindningen?<\/b> Framför allt hur atomerna kan hantera sina valenselektroner. En metall vill lämna ifrån sig elektroner, en icke-metall vill ta upp eller dela. Metall + icke-metall ger därför jonbindning, icke-metall + icke-metall ger kovalent bindning, och metall + metall ger metallbindning.<\/div>\n"}, {"id": 7, "title": "Grundämnen och deras egenskaper", "short": "Grundämnen", "text": "\n<p>Ett <b>grundämne<\/b> består av en enda sorts atomer, alltså atomer med samma antal protoner.<\/p>\n<table><tr><th>Grundämne<\/th><th>Viktig egenskap<\/th><\/tr>\n<tr><td>Järn<\/td><td>Starkt och formbart, kan rosta<\/td><\/tr>\n<tr><td>Koppar<\/td><td>Leder elektricitet mycket bra<\/td><\/tr>\n<tr><td>Aluminium<\/td><td>Bildar ett naturligt, skyddande oxidskikt<\/td><\/tr>\n<tr><td>Titan<\/td><td>Korrosionsbeständigt, står emot nedbrytning<\/td><\/tr>\n<tr><td>Syre<\/td><td>Färg-, lukt- och smaklös gas<\/td><\/tr>\n<tr><td>Kväve<\/td><td>Färg-, lukt-, smak- och giftfri gas, största delen av luften<\/td><\/tr><\/table>\n<p><b>Typiskt för metaller:<\/b> leder värme och elektricitet bra, har metallglans, har ofta hög densitet och hög smältpunkt (med undantag), kan formas, och har få valenselektroner som de lätt lämnar ifrån sig och bildar positiva joner.<\/p>\n<div class=\"ex\"><b>Så avgör du vilken metall det är:<\/b> jämför egenskaper. Rostar den (järn)? Leder den ovanligt bra (koppar)? Är den lätt och får ett matt oxidskikt (aluminium)? Är den lätt, stark och rostar inte (titan)?<\/div>\n<div class=\"ex\"><b>Så skriver du ett bra svar:<\/b> gå från kort fakta till förklaring. \"Koppar leder elektricitet bra\" blir: \"Koppar är en metall. I metallen finns elektroner som kan röra sig fritt och transportera laddning, därför leder koppar elektricitet bra.\"<\/div>\n"}, {"id": 8, "title": "Varför rostar järn?", "short": "Rost", "text": "\n<p>Rost bildas när <b>järn reagerar med syre<\/b> i närvaro av <b>vatten eller fukt<\/b>. Det är en kemisk reaktion som ger ett nytt ämne.<\/p>\n<ol><li>Järnet utsätts för syre och fukt.<\/li><li>En kemisk reaktion sker mellan järn och syre.<\/li><li>Rost bildas. Rost innehåller järn, syre och ofta vatten.<\/li><\/ol>\n<p><b>Varför väger järn med rost mer?<\/b> När järnet rostar binds syreatomer från luften till järnet. Syret har massa. Järnet och rosten tillsammans väger därför mer än järnet gjorde från början, om all rost sitter kvar. Det är inte järnet som blivit tyngre, det är syre som lagts till.<\/p>\n<p><b>Skydd:<\/b> hindra syre och fukt från att nå järnet, till exempel genom att måla det eller täcka det med ett skyddande lager. Aluminium klarar sig själv eftersom det bildar ett tätt oxidskikt som stoppar vidare reaktion.<\/p>\n"}, {"id": 9, "title": "Material – kompositer, biomassa, biomimetik och nanomaterial", "short": "Material", "text": "\n<p>Här ska du kunna beskriva materialen och resonera om fördelar och nackdelar i flera led.<\/p>\n<p><b>Kompositer<\/b> kombinerar egenskaper från två eller flera material. Exempel: glasfiberarmerad plast, som är lätt och stark. Fördel: bra kombination av egenskaper. Nackdel: svårt att återvinna, eftersom materialen är svåra att skilja åt.<\/p>\n<p><b>Biomassa<\/b> är material från levande eller nyligen levande organismer, som trä och växtdelar. Fördel: förnybar resurs som kan brytas ned biologiskt. Nackdel: odling kräver mark och vatten.<\/p>\n<p><b>Biomimetik<\/b> är att efterlikna naturens lösningar i produkter. Exempel: kardborrebandet, som fick sin idé från växten kardborre som fastnar i päls och kläder. Fördel: naturens lösningar är ofta smarta och effektiva.<\/p>\n<p><b>Nanomaterial<\/b> har strukturer i nanoskala, cirka 1–100 nanometer. En nanometer är en miljarddels meter (1 mm / 1 000 000). Exempel: grafen, ett enda lager kolatomer, motsvarande ett molekyllager av grafit. Fördel: särskilda egenskaper som hög styrka och god ledningsförmåga. Nackdel: hälso- och miljörisker är inte helt klarlagda.<\/p>\n<div class=\"ex\"><b>Resonera i flera led:<\/b> \"Kompositer är lätta → cykeln blir lättare → kräver mindre kraft → men svår att återvinna när den är uttjänt → mer avfall.\"<\/div>\n"}], "q": [{"k": "k0", "a": 1, "q": "Vad är materia?", "c": "Allt som har massa och tar plats", "w": ["Allt som går att se med ögat", "Allt som är fast eller flytande", "Allt som består av molekyler"], "e": "Materia har massa och tar plats. Luft räknas, fast den inte syns."}, {"k": "k1", "a": 1, "q": "Var i atomen finns protonerna?", "c": "I atomkärnan", "w": ["Runt kärnan", "I yttersta skalet", "Mellan atomer"], "e": "Protoner och neutroner sitter i kärnan. Elektronerna rör sig runt den."}, {"k": "k2", "a": 1, "q": "Vilken laddning har elektronen?", "c": "Negativ", "w": ["Positiv", "Ingen laddning", "Både plus och minus"], "e": "Elektronen är negativ, protonen positiv, neutronen saknar laddning."}, {"k": "k3", "a": 1, "q": "Vilken partikel saknar laddning?", "c": "Neutronen", "w": ["Protonen", "Elektronen", "Molekylen"], "e": "Neutronen är neutral, därav namnet."}, {"k": "k4", "a": 1, "q": "När är en atom elektriskt neutral?", "c": "Lika många protoner som elektroner", "w": ["Lika många protoner som neutroner", "Inga neutroner alls i atomkärnan", "Fullt yttersta elektronskal runt kärnan"], "e": "Plus och minus tar ut varandra när protoner och elektroner är lika många."}, {"k": "k5", "a": 1, "q": "Vad består en vattenmolekyl av?", "c": "Två väteatomer och en syreatom", "w": ["En väteatom och två syreatomer", "Två syreatomer och en kolatom", "Två väteatomer och en kväveatom"], "e": "H₂O: två väte (H) och ett syre (O)."}, {"k": "k6", "a": 1, "q": "Varför är luft materia fast vi inte ser den?", "c": "Den har massa och tar plats", "w": ["Den består av synliga partiklar", "Den är tyngre än vatten", "Den går inte att trycka ihop alls"], "e": "Ballongen blir större och tyngre när den fylls med luft."}, {"k": "k7", "a": 1, "q": "Vad är en molekyl?", "c": "Två eller flera atomer som sitter ihop", "w": ["En atom som har fått elektrisk laddning", "Den allra minsta delen av en atomkärna", "Ett ämne som bara finns i form av gas"], "e": "Atomerna i en molekyl hålls ihop av kemiska bindningar."}, {"k": "k8", "a": 2, "q": "Vad anger atomnumret?", "c": "Antalet protoner i kärnan", "w": ["Antalet neutroner i kärnan", "Antalet elektronskal", "Protoner plus neutroner"], "e": "Atomnumret är antalet protoner och avgör vilket grundämne det är."}, {"k": "k9", "a": 2, "q": "Vad är masstalet?", "c": "Protoner plus neutroner", "w": ["Protoner plus elektroner", "Bara antalet neutroner", "Antalet valenselektroner"], "e": "Masstal = antalet partiklar i kärnan."}, {"k": "k10", "a": 2, "q": "Kol-12 har 6 protoner. Hur många neutroner?", "c": "6", "w": ["12", "3", "18"], "e": "12 − 6 = 6 neutroner."}, {"k": "k11", "a": 2, "q": "Vad är isotoper?", "c": "Samma grundämne, olika antal neutroner", "w": ["Olika grundämnen med samma masstal", "Atomer med olika antal protoner i kärnan", "Joner av samma ämne med olika laddning"], "e": "Isotoper har samma antal protoner men olika antal neutroner."}, {"k": "k12", "a": 2, "q": "Vad skiljer kol-12 från kol-14?", "c": "Antalet neutroner", "w": ["Antalet protoner", "Antalet elektronskal", "Vilket grundämne det är"], "e": "Båda har 6 protoner. Kol-14 har två neutroner mer."}, {"k": "k13", "a": 2, "q": "Vad är atommassa?", "c": "Medelmassan av ämnets naturliga isotoper", "w": ["Den sammanlagda massan av alla elektroner", "Antalet protoner och neutroner i atomkärnan", "Massan av ämnets allra tyngsta isotop"], "e": "Därför är atommassan sällan ett jämnt heltal."}, {"k": "k14", "a": 2, "q": "Vad bestämmer vilket grundämne en atom tillhör?", "c": "Antalet protoner", "w": ["Antalet neutroner", "Antalet elektronskal", "Atomens massa"], "e": "Protonerna bestämmer ämnet, neutronerna bestämmer isotopen."}, {"k": "k15", "a": 3, "q": "Hur många elektroner rymmer K-skalet högst?", "c": "2", "w": ["8", "1", "18"], "e": "K-skalet är innerst och rymmer 2."}, {"k": "k16", "a": 3, "q": "Hur många elektroner rymmer L-skalet högst?", "c": "8", "w": ["2", "6", "10"], "e": "L-skalet rymmer 8 i den förenklade modellen."}, {"k": "k17", "a": 3, "q": "Vad är valenselektroner?", "c": "Elektronerna i det yttersta skalet", "w": ["Elektronerna i det innersta skalet", "Elektronerna som sitter inne i atomkärnan", "Alla elektroner utom de i K-skalet"], "e": "Valenselektronerna sitter ytterst och deltar i reaktioner."}, {"k": "k18", "a": 3, "q": "Varför är valenselektronerna viktiga?", "c": "De avgör hur atomen reagerar", "w": ["De bestämmer vilket ämne det är", "De ger atomen nästan all massa", "De håller ihop atomkärnan"], "e": "Reaktioner handlar om valenselektroner som lämnas, tas upp eller delas."}, {"k": "k19", "a": 3, "q": "Hur många valenselektroner har natrium?", "c": "1", "w": ["7", "8", "3"], "e": "Natrium: 2 + 8 + 1. En valenselektron."}, {"k": "k20", "a": 3, "q": "Hur många valenselektroner har klor?", "c": "7", "w": ["1", "8", "2"], "e": "Klor: 2 + 8 + 7. Sju valenselektroner."}, {"k": "k21", "a": 3, "q": "Vad händer när natrium lämnar en elektron till klor?", "c": "Det bildas joner som dras till varandra", "w": ["Atomerna byter helt plats med varandra", "Båda atomerna blir elektriskt neutrala", "Det bildas en ny isotop av grundämnet natrium"], "e": "Na⁺ och Cl⁻ dras till varandra."}, {"k": "k22", "a": 3, "q": "Vilket skal ligger närmast kärnan?", "c": "K-skalet", "w": ["L-skalet", "M-skalet", "Valensskalet"], "e": "Skalen heter K, L, M … inifrån och ut."}, {"k": "k23", "a": 4, "q": "Vad är en period i periodiska systemet?", "c": "En vågrät rad", "w": ["En lodrät kolumn", "En ruta i tabellen", "En rad metaller"], "e": "Period = rad. Grupp = kolumn."}, {"k": "k24", "a": 4, "q": "Vad har ämnen i samma period gemensamt?", "c": "Lika många elektronskal", "w": ["Lika många valenselektroner", "Lika många protoner", "Samma kemiska egenskaper"], "e": "Period 3 betyder tre elektronskal."}, {"k": "k25", "a": 4, "q": "Vad har ämnen i samma grupp ofta gemensamt?", "c": "Lika många valenselektroner", "w": ["Lika många elektronskal", "Samma masstal", "Samma antal neutroner"], "e": "Därför liknar de varandra kemiskt."}, {"k": "k26", "a": 4, "q": "Hur många valenselektroner har alkalimetallerna?", "c": "1", "w": ["7", "8", "2"], "e": "Grupp 1 har en valenselektron."}, {"k": "k27", "a": 4, "q": "Vilken laddning får en halogenjon?", "c": "−1", "w": ["+1", "−7", "+7"], "e": "Halogener tar upp en elektron och blir −1."}, {"k": "k28", "a": 4, "q": "Varför reagerar ädelgaser sällan?", "c": "De har redan fullt yttersta skal", "w": ["De har bara en valenselektron", "De saknar helt elektroner", "De är mycket tunga metaller"], "e": "Fullt skal gör dem stabila."}, {"k": "k29", "a": 4, "q": "Hur finns halogener i rent tillstånd?", "c": "Som tvåatomiga molekyler", "w": ["Som fria enskilda atomer", "Som positivt laddade joner", "Som ett fast metallgitter"], "e": "F₂, Cl₂, Br₂, I₂."}, {"k": "k30", "a": 4, "q": "Vad skiljer helium från väte?", "c": "Helium har fullt skal, väte inte", "w": ["Väte har fler skal än helium", "Helium ligger i period 2", "Väte är en ädelgas, helium inte"], "e": "Båda i period 1. Helium har 2 elektroner och fullt K-skal."}, {"k": "k31", "a": 4, "q": "Natrium och klor ligger båda i period 3. Vad betyder det?", "c": "Båda har tre elektronskal", "w": ["Båda har tre valenselektroner", "Båda bildar positiva joner", "Båda är reaktiva metaller"], "e": "Period = antal skal."}, {"k": "k32", "a": 4, "q": "Hur reagerar alkalimetaller med vatten?", "c": "Kraftigt", "w": ["Inte alls", "Långsamt", "Bara i värme"], "e": "Alkalimetaller är mycket reaktiva."}, {"k": "k33", "a": 5, "q": "Vad är en jon?", "c": "En atom eller atomgrupp med laddning", "w": ["En atom helt utan neutroner i kärnan", "Två atomer som delar på ett elektronpar", "Ett grundämne som finns i gasform"], "e": "Laddningen kommer av att elektroner tagits upp eller lämnats."}, {"k": "k34", "a": 5, "q": "En atom lämnar ifrån sig elektroner. Vilken laddning får den?", "c": "Positiv", "w": ["Negativ", "Ingen", "Växlande"], "e": "Färre elektroner än protoner ger plus."}, {"k": "k35", "a": 5, "q": "En atom tar upp elektroner. Vilken laddning får den?", "c": "Negativ", "w": ["Positiv", "Ingen", "Växlande"], "e": "Fler elektroner än protoner ger minus."}, {"k": "k36", "a": 5, "q": "Vilken jon bildar natrium?", "c": "Na⁺", "w": ["Na⁻", "Na²⁺", "Na²⁻"], "e": "Natrium lämnar en elektron."}, {"k": "k37", "a": 5, "q": "Vilken jon bildar klor?", "c": "Cl⁻", "w": ["Cl⁺", "Cl²⁻", "Cl²⁺"], "e": "Klor tar upp en elektron."}, {"k": "k38", "a": 5, "q": "Varför dras Na⁺ och Cl⁻ till varandra?", "c": "De har motsatt laddning", "w": ["De har samma laddning", "De har lika många neutroner", "De ligger i samma grupp"], "e": "Plus och minus dras till varandra."}, {"k": "k39", "a": 5, "q": "Vad bildar natriumjoner och kloridjoner tillsammans?", "c": "Natriumklorid, vanligt salt", "w": ["Vatten, vanlig vätska", "Vätgas, en lätt gas", "Rost, en brun beläggning"], "e": "NaCl är bordssalt."}, {"k": "k40", "a": 5, "q": "Fyll i minnesregeln: Förlorar elektroner = …", "c": "positiv", "w": ["negativ", "neutral", "tyngre"], "e": "Förlorar = positiv. Tar upp = negativ."}, {"k": "k41", "a": 6, "q": "Vad håller ihop en jonbindning?", "c": "Attraktion mellan motsatta joner", "w": ["Elektronpar som atomerna delar", "Fria elektroner i ett gitter", "Protoner som byter plats"], "e": "Positiv och negativ jon dras ihop."}, {"k": "k42", "a": 6, "q": "Vad kännetecknar en kovalent bindning?", "c": "Atomer delar på elektronpar", "w": ["Motsatta joner dras ihop", "Elektroner rör sig i metallen", "Atomer byter neutroner"], "e": "Kallas även elektronparbindning."}, {"k": "k43", "a": 6, "q": "Vad kännetecknar metallbindning?", "c": "Rörliga elektroner håller ihop metalljoner", "w": ["Positiva och negativa joner dras till varandra", "Två atomer delar på ett gemensamt elektronpar", "Neutroner från kärnan håller ihop atomerna"], "e": "Elektronhavet gör att metaller leder ström."}, {"k": "k44", "a": 6, "q": "Jonbindning är vanlig mellan …", "c": "metall och icke-metall", "w": ["två icke-metaller", "två metaller", "ädelgas och metall"], "e": "Metallen ger elektroner, icke-metallen tar."}, {"k": "k45", "a": 6, "q": "Kovalent bindning är vanlig mellan …", "c": "två icke-metaller", "w": ["metall och icke-metall", "två metaller", "ädelgaser"], "e": "Till exempel H₂ och H₂O."}, {"k": "k46", "a": 6, "q": "Vilket är ett exempel på jonbindning?", "c": "Natriumklorid", "w": ["Vätgasmolekyl", "Kopparbit", "Vattenmolekyl"], "e": "NaCl består av Na⁺ och Cl⁻."}, {"k": "k47", "a": 6, "q": "Vilket är ett exempel på kovalent bindning?", "c": "Vatten", "w": ["Natriumklorid", "Järn", "Bordssalt"], "e": "H₂O: syre och väte delar elektronpar."}, {"k": "k48", "a": 6, "q": "Varför leder metaller elektricitet?", "c": "Elektronerna rör sig fritt i metallen", "w": ["Jonerna i metallen är negativa", "Metaller har fulla elektronskal", "Protonerna rör sig mellan atomerna"], "e": "De rörliga elektronerna transporterar laddning."}, {"k": "k49", "a": 6, "q": "Vad avgör vilken bindning som bildas?", "c": "Hur atomerna hanterar valenselektronerna", "w": ["Hur många neutroner atomerna har", "Hur tunga atomerna är i jämförelse", "Vilken period atomerna ligger i"], "e": "Lämna, ta upp eller dela elektroner ger olika bindning."}, {"k": "k50", "a": 7, "q": "Vad är ett grundämne?", "c": "Ett ämne med en enda sorts atomer", "w": ["Ett ämne som består av molekyler", "Ett ämne som alltid är metall", "Ett ämne som har flera isotoper"], "e": "Alla atomer har samma antal protoner."}, {"k": "k51", "a": 7, "q": "Vilken egenskap är typisk för koppar?", "c": "Leder elektricitet mycket bra", "w": ["Bildar ett skyddande oxidskikt", "Är en färglös och luktfri gas", "Utgör den största delen av luften"], "e": "Koppar används i elkablar."}, {"k": "k52", "a": 7, "q": "Vilken egenskap är typisk för aluminium?", "c": "Bildar ett skyddande oxidskikt", "w": ["Rostar lätt i fuktig luft", "Är en gas vid rumstemperatur", "Leder inte elektricitet"], "e": "Oxidskiktet skyddar mot vidare angrepp."}, {"k": "k53", "a": 7, "q": "Vilken egenskap är typisk för titan?", "c": "Står emot korrosion bra", "w": ["Rostar snabbt i fukt", "Är en luktfri gas", "Har mycket låg smältpunkt"], "e": "Titan är korrosionsbeständigt."}, {"k": "k54", "a": 7, "q": "Vilken egenskap är typisk för kväve?", "c": "Färglös gas, största delen av luften", "w": ["Metall med tydlig metallglans", "Gas som får järn att rosta", "Fast ämne vid rumstemperatur"], "e": "Luften består till största delen av kväve."}, {"k": "k55", "a": 7, "q": "Vad är typiskt för metaller?", "c": "Leder värme och elektricitet bra", "w": ["Är gaser vid rumstemperatur", "Har många valenselektroner", "Saknar glans och är matta"], "e": "Metallglans, ledningsförmåga, hög densitet."}, {"k": "k56", "a": 7, "q": "Vilken sorts joner bildar metaller oftast?", "c": "Positiva joner", "w": ["Negativa joner", "Inga joner alls", "Tvåatomiga molekyler"], "e": "Få valenselektroner som lätt lämnas."}, {"k": "k57", "a": 7, "q": "Varför leder koppar elektricitet bra? Välj den bästa förklaringen.", "c": "Elektronerna kan röra sig och bära laddning", "w": ["Koppar har många protoner som rör sig fritt", "Koppar har ett fullt yttersta elektronskal", "Koppar är mycket tungt och har hög densitet"], "e": "Rörliga elektroner transporterar laddningen."}, {"k": "k58", "a": 7, "q": "Vilken beskrivning passar järn?", "c": "Starkt, formbart och kan rosta", "w": ["Färglös och luktfri gas", "Mjukt, reagerar kraftigt med vatten", "Leder varken värme eller ström"], "e": "Järn är starkt och formbart men rostar."}, {"k": "k59", "a": 8, "q": "Vad krävs för att järn ska rosta?", "c": "Syre och vatten eller fukt", "w": ["Bara hög värme från solen", "Bara kväve från luften", "Salt och starkt solljus"], "e": "Syre och fukt tillsammans."}, {"k": "k60", "a": 8, "q": "Vad innehåller rost?", "c": "Järn, syre och ofta vatten", "w": ["Bara rent järn utan annat", "Järn, kväve och lite kol", "Kol, syre och lite väte"], "e": "Rost är järn som bundit syre."}, {"k": "k61", "a": 8, "q": "Varför väger järn med rost mer än järnet från början?", "c": "Syre från omgivningen har bundits", "w": ["Järnet drar till sig damm och smuts", "Rost är tyngre än rent syre", "Järnatomerna har blivit fler"], "e": "Syret som lagts till har massa."}, {"k": "k62", "a": 8, "q": "Hur kan man skydda järn från rost?", "c": "Måla eller täcka med skyddande lager", "w": ["Lägga det i rent vatten varje dag", "Värma det regelbundet till hög temperatur", "Blanda det med mer syre från luften"], "e": "Hindra syre och fukt från att nå järnet."}, {"k": "k63", "a": 8, "q": "Vad händer kemiskt när järn rostar?", "c": "Järn reagerar med syre", "w": ["Järn smälter sakta", "Järn avger syre", "Järn blir till gas"], "e": "En kemisk reaktion ger ett nytt ämne."}, {"k": "k64", "a": 8, "q": "Varför rostar aluminium inte på samma sätt?", "c": "Det bildar ett skyddande oxidskikt", "w": ["Det saknar helt valenselektroner", "Det är en ädelgas och inte en metall", "Det innehåller inget syre i sig"], "e": "Oxidskiktet stoppar vidare reaktion."}, {"k": "k65", "a": 9, "q": "Vad är en komposit?", "c": "Material som kombinerar flera material", "w": ["Material från levande organismer", "Material som efterliknar naturen", "Material i nanometerskala"], "e": "Kombinerar egenskaper från flera material."}, {"k": "k66", "a": 9, "q": "Vilket är ett exempel på komposit?", "c": "Glasfiberarmerad plast", "w": ["Rent järn från gruva", "Trä från björk eller ek", "Grafen av kolatomer"], "e": "Glasfiber + plast = lätt och starkt."}, {"k": "k67", "a": 9, "q": "Vilken nackdel har kompositer?", "c": "Kan vara svåra att återvinna", "w": ["Är alltid mycket tunga", "Går inte att forma till föremål", "Rostar lätt i fuktig luft"], "e": "Materialen är svåra att skilja åt."}, {"k": "k68", "a": 9, "q": "Vad är biomassa?", "c": "Material från levande organismer", "w": ["Material tillverkat av plast", "Material som bildas i berggrunden", "Material som leder ström bra"], "e": "Trä, växtdelar och liknande."}, {"k": "k69", "a": 9, "q": "Vilken fördel har biomassa?", "c": "Förnybar resurs", "w": ["Håller för evigt", "Kräver ingen mark", "Bryts aldrig ned"], "e": "Växer upp igen och bryts ned biologiskt."}, {"k": "k70", "a": 9, "q": "Vad är biomimetik?", "c": "Att efterlikna lösningar från naturen", "w": ["Att odla material på stora åkrar", "Att blanda flera olika material till ett", "Att göra materialens strukturer mycket små"], "e": "Till exempel kardborrebandet."}, {"k": "k71", "a": 9, "q": "Vilket är ett exempel på biomimetik?", "c": "Kardborrebandet", "w": ["Glasfiberplast", "Grafen", "Rostfritt stål"], "e": "Idén kom från växten kardborre."}, {"k": "k72", "a": 9, "q": "Hur stora är strukturerna i nanomaterial?", "c": "Cirka 1–100 nanometer", "w": ["Cirka 1–100 millimeter", "Cirka 1–100 mikrometer", "Mer än en meter"], "e": "1 nm är en miljarddels meter."}, {"k": "k73", "a": 9, "q": "Vad är grafen?", "c": "Ett mycket tunt lager av kolatomer", "w": ["En metall som leder ström dåligt", "Ett material gjort av växtfibrer", "En legering av järn och lite kol"], "e": "Ett enda molekyllager av grafit."}, {"k": "k74", "a": 9, "q": "Vilken nackdel har nanomaterial?", "c": "Riskerna är inte helt klarlagda", "w": ["De går inte att tillverka i verkligheten", "De är alltid giftiga för människor", "De leder aldrig elektricitet"], "e": "Hälso- och miljörisker undersöks."}, {"k": "k75", "a": 9, "q": "Hur lång är en nanometer?", "c": "En miljarddels meter", "w": ["En miljondels meter", "En tusendels meter", "En tusendels millimeter"], "e": "1 nm = 1 mm / 1 000 000."}], "f": [{"k": "f0", "a": 1, "q": "Vilka partiklar finns i atomkärnan?", "c": "Protoner och neutroner", "w": ["Protoner och elektroner", "Neutroner och elektroner", "Bara neutroner"], "e": "Kärnan innehåller protoner och neutroner."}, {"k": "f1", "a": 1, "q": "En neutral atom har 8 protoner. Hur många elektroner?", "c": "8", "w": ["16", "0", "4"], "e": "Neutral = lika många protoner som elektroner."}, {"k": "f2", "a": 1, "q": "Vilket påstående är sant?", "c": "Sten, luft och vatten är alla materia", "w": ["Bara fasta ämnen räknas som materia", "Ljus är materia eftersom det syns", "Gaser är inte materia eftersom de inte syns"], "e": "Allt som har massa och tar plats."}, {"k": "f3", "a": 1, "q": "Vad håller ihop atomerna i en molekyl?", "c": "Kemiska bindningar", "w": ["Neutroner i kärnan", "Tyngdkraften", "Magnetiska krafter"], "e": "Molekyler hålls ihop av bindningar."}, {"k": "f4", "a": 1, "q": "Varför kan vi inte se atomer?", "c": "De är för små för blotta ögat", "w": ["De är helt genomskinliga", "De rör sig för snabbt", "De finns bara i gaser"], "e": "Atomer är extremt små."}, {"k": "f5", "a": 2, "q": "En atom har 11 protoner och 12 neutroner. Masstal?", "c": "23", "w": ["11", "12", "1"], "e": "11 + 12 = 23."}, {"k": "f6", "a": 2, "q": "Två atomer har samma antal protoner men olika antal neutroner. Vad är de?", "c": "Isotoper av samma grundämne", "w": ["Två helt olika grundämnen", "Joner med olika stor laddning", "Molekyler av samma grundämne"], "e": "Samma ämne, olika massa."}, {"k": "f7", "a": 2, "q": "Vad ändrar vilket grundämne en atom är?", "c": "Att ändra antalet protoner", "w": ["Att ändra antalet neutroner", "Att ändra antalet elektroner", "Att ändra antalet skal"], "e": "Protonerna bestämmer ämnet."}, {"k": "f8", "a": 2, "q": "Kol-14 har 6 protoner. Hur många neutroner?", "c": "8", "w": ["6", "14", "20"], "e": "14 − 6 = 8."}, {"k": "f9", "a": 2, "q": "Varför är atommassan sällan ett heltal?", "c": "Den är ett medelvärde av isotoper", "w": ["Elektronerna väger ganska mycket", "Protonerna har olika stor massa", "Den mäts i gram i stället för i u"], "e": "Naturliga isotoper vägs samman."}, {"k": "f10", "a": 3, "q": "En atom har 11 elektroner: 2 i K, 8 i L. Valenselektroner?", "c": "1", "w": ["8", "11", "3"], "e": "Det yttersta skalet har 1."}, {"k": "f11", "a": 3, "q": "Vilket ämne har sju valenselektroner?", "c": "Klor", "w": ["Natrium", "Helium", "Neon"], "e": "Klor är en halogen."}, {"k": "f12", "a": 3, "q": "Varför reagerar natrium och klor så lätt med varandra?", "c": "Natrium vill lämna en elektron, klor ta upp en", "w": ["Båda har redan fulla yttersta elektronskal", "Båda har exakt lika många neutroner i kärnan", "Båda ligger i samma grupp i periodiska systemet"], "e": "Ett byte som ger båda fullt skal."}, {"k": "f13", "a": 3, "q": "Vad händer med antalet elektronskal längre ned i systemet?", "c": "Det ökar för varje period", "w": ["Det minskar för varje period", "Det är alltid två stycken", "Det beror på antalet neutroner"], "e": "Period = antal skal."}, {"k": "f14", "a": 3, "q": "Vilket skal fylls först med elektroner?", "c": "K-skalet", "w": ["L-skalet", "Det yttersta skalet", "Alla fylls samtidigt"], "e": "Skalen fylls inifrån."}, {"k": "f15", "a": 4, "q": "Litium står i grupp 1. Vilken jon bildar det?", "c": "+1", "w": ["−1", "+7", "0"], "e": "Alkalimetaller lämnar en elektron."}, {"k": "f16", "a": 4, "q": "Vilket grundämne liknar natrium mest kemiskt?", "c": "Litium", "w": ["Klor", "Neon", "Helium"], "e": "Samma grupp, samma antal valenselektroner."}, {"k": "f17", "a": 4, "q": "Fluor och klor står i samma grupp. Vad har de gemensamt?", "c": "Sju valenselektroner", "w": ["Tre elektronskal", "Fullt yttersta skal", "Bildar (metall) reagerar med brom (icke-metall). Trolig bindning?", "c": "Jonbindning", "w": ["Kovalent", "Metallbindning", "Ingen"], "e": "Metall + icke-metall ger jonbindning."}, {"k": "f29", "a": 6, "q": "Vad delar atomerna på i en kovalent bindning?", "c": "Elektronpar", "w": ["Protoner", "Neutroner", "Hela skal"], "e": "Elektronparbindning."}, {"k": "f30", "a": 6, "q": "Vilken bindning finns i bordssalt?", "c": "Jonbindning", "w": ["Kovalent", "Metallbindning", "Ingen"], "e": "NaCl: Na⁺ och Cl⁻."}, {"k": "f31", "a": 7, "q": "Vilket grundämne skyddas av sitt eget oxidskikt?", "c": "Aluminium", "w": ["Järnet", "Kopparn", "Natrium"], "e": "Aluminium bildar ett tätt oxidskikt."}, {"k": "f32", "a": 7, "q": "Två metallbitar: en rostar, en gör det inte. Vilken kan vara titan?", "c": "Den som inte rostar", "w": ["Den som rostar snabbt", "Båda två lika gärna", "Ingen av de två bitarna"], "e": "Titan är korrosionsbeständigt."}, {"k": "f33", "a": 7, "q": "Vad avgör om ett ämne leder ström bra?", "c": "Om elektroner kan röra sig fritt", "w": ["Hur tungt ämnet är i handen", "Vilken färg och glans ämnet har", "Hur många neutroner ämnet har"], "e": "Fria elektroner bär laddning."}, {"k": "f34", "a": 7, "q": "Vad har syre och kväve gemensamt?", "c": "Båda är färglösa gaser", "w": ["Båda är mjuka metaller", "Båda leder ström mycket bra", "Båda har tydlig metallglans"], "e": "Båda är gaser i luften."}, {"k": "f35", "a": 7, "q": "Hur avgör man vilken metall man har?", "c": "Jämför glans, densitet, ledning och rost", "w": ["Räknar antalet neutroner i atomkärnan", "Tittar på vilken färg rosten får", "Väger den under vatten i ett kärl"], "e": "Egenskaperna skiljer metallerna åt."}, {"k": "f36", "a": 8, "q": "En spik i torr luft, en i fuktig. Vilken rostar snabbast?", "c": "Den i fuktig luft", "w": ["Den i torr luft", "Båda lika snabbt", "Ingen av dem"], "e": "Fukt behövs för rost."}, {"k": "f37", "a": 8, "q": "Vad är rost?", "c": "Ett nytt ämne av järn och syre", "w": ["Järn som blivit smutsigt av jord", "Järn i flytande form vid låg värme", "Rent syre som lagt sig på ytan"], "e": "Rost är en kemisk förening."}, {"k": "f38", "a": 8, "q": "Du väger järnet och rosten efter rostningen. Vad gäller?", "c": "Tillsammans väger de mer än före", "w": ["Tillsammans väger de mindre än före", "Exakt lika mycket som järnet före", "Rosten väger ingenting alls"], "e": "Syre har bundits och tillför massa."}, {"k": "f39", "a": 8, "q": "Varför skyddar färg järnet?", "c": "Färgen stänger ute syre och fukt", "w": ["Färgen gör järnet tyngre och hårdare", "Färgen tar bort syret ur luften", "Färgen omvandlar järnet till titan"], "e": "Ingen reaktion utan syre och fukt."}, {"k": "f40", "a": 8, "q": "Rost innehåller ämnen från …", "c": "järn, luft och vatten", "w": ["bara järnet självt", "bara luften omkring", "bara vattnet omkring"], "e": "Järn + syre + ofta vatten."}, {"k": "f41", "a": 9, "q": "Ett lätt, starkt cykelmaterial som är svårt att återvinna?", "c": "Komposit", "w": ["Biomassa", "Rent järn", "Biomimetik"], "e": "Till exempel kolfiber eller glasfiber."}, {"k": "f42", "a": 9, "q": "Material som är förnybart och bryts ned biologiskt?", "c": "Biomassa", "w": ["Glasfiberplast", "Grafen", "Titan"], "e": "Trä och växtdelar."}, {"k": "f43", "a": 9, "q": "En simdräkt efterliknar hajhud. Vilket begrepp?", "c": "Biomimetik", "w": ["Komposit", "Nanomaterial", "Biomassa"], "e": "Naturen som förebild."}, {"k": "f44", "a": 9, "q": "Vilken nackdel har biomassa?", "c": "Odling kräver mark och vatten", "w": ["Går inte att bryta ned", "Är en ändlig resurs", "Är giftig för djur"], "e": "Mark och vatten konkurrerar med annat."}, {"k": "f45", "a": 9, "q": "Varför är nanomaterial omdiskuterade?", "c": "Hälso- och miljöeffekter är inte kända", "w": ["De finns ännu inte på riktigt", "De är alldeles för stora att använda", "De är alldeles för dyra att tillverka"], "e": "Riskerna undersöks fortfarande."}, {"k": "f46", "a": 9, "q": "Vilken fördel har grafen?", "c": "Hög styrka och god ledningsförmåga", "w": ["Mycket tjockt och tungt material", "Rostar aldrig eftersom det är en metall", "Förnybart eftersom det kommer från skog"], "e": "Ett lager kolatomer med särskilda egenskaper."}], "summary": "\n<p><b>Atomen.<\/b> Materia har massa och tar plats och består av atomer. Protoner (+) och neutroner (0) i kärnan, elektroner (−) runt. Neutral atom: lika många protoner som elektroner. Molekyl: flera atomer med bindningar, t.ex. H₂O.<\/p>\n<p><b>Atomnummer, masstal, isotoper.<\/b> Atomnummer = protoner, avgör ämnet. Masstal = protoner + neutroner. Isotoper: samma ämne, olika antal neutroner. Atommassa = medelvärde av isotoperna.<\/p>\n<p><b>Elektronskal.<\/b> K rymmer 2, L rymmer 8. Valenselektroner sitter ytterst och styr reaktionerna. Natrium 1, klor 7.<\/p>\n<p><b>Periodiska systemet.<\/b> Period = rad = antal skal. Grupp = kolumn = antal valenselektroner. Grupp 1: 1 valenselektron, +1, reaktiva. Grupp 17: 7, −1, tvåatomiga molekyler. Grupp 18: fullt skal, stabila, fria atomer.<\/p>\n<p><b>Joner.<\/b> Lämnar elektroner → positiv. Tar upp → negativ. Na⁺ + Cl⁻ → NaCl.<\/p>\n<p><b>Bindningar.<\/b> Jon: metall + icke-metall (NaCl). Kovalent: icke-metaller delar elektronpar (H₂, H₂O). Metall: rörliga elektroner (koppar, järn) – därför leder metaller ström.<\/p>\n<p><b>Grundämnen.<\/b> Järn starkt, rostar. Koppar leder bäst. Aluminium oxidskikt. Titan korrosionsbeständigt. Syre och kväve färglösa gaser. Metaller: glans, ledning, hög densitet, positiva joner.<\/p>\n<p><b>Rost.<\/b> Järn + syre + fukt → rost. Väger mer eftersom syre bundits. Skydd: måla eller täcka.<\/p>\n<p><b>Material.<\/b> Komposit kombinerar material (svår att återvinna). Biomassa förnybar (kräver mark). Biomimetik härmar naturen (kardborre). Nanomaterial 1–100 nm, t.ex. grafen (risker oklara).<\/p>\n<p><b>Provsvar:<\/b> gå från kort fakta till förklaring med \"eftersom\" och \"därför\".<\/p>\n"}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const AREAS=D.areas, QS=D.q, FS=D.f;
const KEY='kemiprovet-v1';
let S={done:[],score:{},wrong:[],free:false,seen:{}};
try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const byKey={};[...QS,...FS].forEach(q=>byKey[q.k]=q);
function unlocked(id){return S.free||id===1||S.done.includes(id-1)}
function allDone(){return AREAS.every(a=>S.done.includes(a.id))}
function addWrong(k){if(!S.wrong.includes(k))S.wrong.push(k);save()}
function remWrong(k){S.wrong=S.wrong.filter(x=>x!==k);save()}

/* ---------- Hem ---------- */
function home(){
  const n=S.done.length, pct=Math.round(100*n/AREAS.length);
  let h=`<div class="top"><div><div class="eyebrow">Kemi · Materiens uppbyggnad</div><h1>Kemiprovet</h1></div></div>
  <div class="card"><div class="eyebrow">Så funkar det</div>
  <p style="margin:6px 0 0">Läs ett område, svara på frågorna, lås upp nästa. När alla nio är klara får du en sammanfattning och ett slutprov med nya frågor.</p>
  <div class="prog"><i style="width:${pct}%"></i></div><div class="tiny">${n} av ${AREAS.length} områden klara</div></div>
  <div class="list">`;
  AREAS.forEach(a=>{
    const done=S.done.includes(a.id), open=unlocked(a.id), sc=S.score[a.id];
    const st=done?`<span class="pill ok">${sc?sc[0]+'/'+sc[1]:'Klar'}</span>`:open?`<span class="pill">Läs</span>`:`<span class="pill">Låst</span>`;
    h+=`<button class="area ${open?'':'locked'}" ${open?`onclick="area(${a.id})"`:'disabled'}><span class="num">${a.id}</span><span><span class="t">${esc(a.title)}</span><br><span class="s">${QS.filter(q=>q.a===a.id).length} kontrollfrågor</span></span>${st}</button>`;
  });
  const ad=allDone();
  h+=`</div><div class="list" style="margin-top:18px">
  <button class="area ${ad?'':'locked'}" ${ad?'onclick="summary()"':'disabled'}><span class="num">∑</span><span><span class="t">Sammanfattning</span><br><span class="s">Hela materialet på en sida</span></span><span class="pill">${ad?'Läs':'Låst'}</span></button>
  <button class="area ${ad?'':'locked'}" ${ad?'onclick="examStart()"':'disabled'}><span class="num">★</span><span><span class="t">Slutprov</span><br><span class="s">${FS.length} nya frågor, blandade</span></span><span class="pill">${S.exam?S.exam.right+'/'+S.exam.total:(ad?'Starta':'Låst')}</span></button>
  <button class="area ${S.wrong.length?'':'locked'}" ${S.wrong.length?'onclick="repeat()"':'disabled'}><span class="num">↻</span><span><span class="t">Repetera fel</span><br><span class="s">Frågor du svarat fel på</span></span><span class="pill">${S.wrong.length}</span></button>
  </div>
  <p class="tiny" style="margin-top:22px">${S.free?'Fri ordning är på. ':'Områdena låses upp i ordning. '}<button class="link" onclick="S.free=!S.free;save();home()">${S.free?'Lås i ordning':'Lås upp alla'}</button> · <button class="link" onclick="resetAll()">Börja om</button></p>`;
  app.innerHTML=h; window.scrollTo(0,0);
}
function resetAll(){
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Tillbaka</button></div><div class="card"><h2>Börja om från början?</h2><p>Alla resultat och fel-listan raderas.</p><div class="row"><button class="btn" onclick="S={done:[],score:{},wrong:[],free:false,seen:{}};save();home()">Ja, börja om</button><button class="btn ghost" onclick="home()">Avbryt</button></div></div>`;
}

/* ---------- Område: text + kontrollfrågor ---------- */
function area(id){
  const a=AREAS.find(x=>x.id===id);
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button><span class="eyebrow">Område ${id} av ${AREAS.length}</span></div>
  <h2>${esc(a.title)}</h2><div class="read" style="margin-top:10px">${a.text}</div>
  <div class="row"><button class="btn" onclick="quiz(${id})">Till kontrollfrågorna →</button></div>
  <p class="tiny">Läs texten först. Frågorna ställs en i taget och du får svar direkt.</p>`;
  window.scrollTo(0,0);
}
function quiz(id){
  const qs=shuffle(QS.filter(q=>q.a===id)); let i=0, right=0;
  function show(){
    const q=qs[i], opts=shuffle([q.c,...q.w]); const L='ABCD';
    app.innerHTML=`<div class="top"><button class="back" onclick="area(${id})">‹ Texten</button><span class="eyebrow">Fråga ${i+1} av ${qs.length}</span></div>
    <div class="prog"><i style="width:${Math.round(100*i/qs.length)}%"></i></div>
    <p class="qtext">${esc(q.q)}</p><div class="opts" id="opts">${opts.map((o,j)=>`<button class="opt" data-o="${esc(o)}"><b>${L[j]}</b><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
    function answer(b){
      const ok=b.dataset.o===q.c; if(ok)right++; else addWrong(q.k);
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.o===q.c)x.classList.add('right'); else if(x===b)x.classList.add('wrong')});
      document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Rätt!':'Inte riktigt.'}</b> ${esc(q.e)}</div><div class="row"><button class="btn" id="nx">${i+1<qs.length?'Nästa fråga →':'Visa resultat'}</button></div>`;
      document.getElementById('nx').onclick=()=>{i++; i<qs.length?show():result()};
      document.getElementById('nx').focus();
    }
    window.scrollTo(0,0);
  }
  function result(){
    if(!S.done.includes(id))S.done.push(id); S.score[id]=[right,qs.length]; save();
    const pct=right/qs.length, next=AREAS.find(x=>x.id===id+1), ad=allDone();
    app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button></div>
    <div class="card"><div class="eyebrow">Område ${id} klart</div><div class="big" style="margin:8px 0">${right} / ${qs.length}</div>
    <p>${pct===1?'Allt rätt. Vidare!':pct>=.7?'Bra. Titta en extra gång på det du missade.':'Läs texten en gång till innan du går vidare. Fel-frågorna ligger under Repetera.'}</p>
    <div class="row">${next?`<button class="btn" onclick="area(${next.id})">Nästa område →</button>`:ad?`<button class="btn" onclick="summary()">Till sammanfattningen →</button>`:''}<button class="btn ghost" onclick="area(${id})">Läs igen</button></div></div>`;
    window.scrollTo(0,0);
  }
  show();
}

/* ---------- Sammanfattning ---------- */
function summary(){
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button></div><h2>Sammanfattning</h2><div class="read" style="margin-top:10px">${D.summary}</div>
  <div class="row"><button class="btn" onclick="examStart()">Starta slutprovet →</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- Slutprov: inga svar visas förrän efter inlämning ---------- */
let E=null;
function examStart(){
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button></div>
  <div class="card"><div class="eyebrow">Slutprov</div><h2 style="margin-top:6px">${FS.length} frågor, alla områden</h2>
  <p>Frågorna är nya och kommer i blandad ordning. Du ser inga rätta svar förrän du lämnar in. Du kan hoppa mellan frågorna.</p>
  <div class="row"><button class="btn" onclick="examBegin()">Börja</button></div></div>`;
}
function examBegin(){
  E={qs:shuffle(FS).map(q=>({q,opts:shuffle([q.c,...q.w]),ans:null})),i:0};
  examShow();
}
function examShow(){
  const it=E.qs[E.i], L='ABCD', n=E.qs.length, answered=E.qs.filter(x=>x.ans).length;
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button><span class="eyebrow">Fråga ${E.i+1} av ${n} · ${answered} besvarade</span></div>
  <div class="grid">${E.qs.map((x,j)=>`<button class="${x.ans?'done':''} ${j===E.i?'cur':''}" onclick="E.i=${j};examShow()">${j+1}</button>`).join('')}</div>
  <p class="qtext">${esc(it.q.q)}</p>
  <div class="opts">${it.opts.map((o,j)=>`<button class="opt ${it.ans===o?'sel':''}" onclick="E.qs[${E.i}].ans=this.dataset.o;examShow()" data-o="${esc(o)}"><b>${L[j]}</b><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="row"><button class="btn ghost" onclick="E.i=Math.max(0,E.i-1);examShow()" ${E.i===0?'disabled':''}>‹ Föregående</button>
  ${E.i<n-1?`<button class="btn" onclick="E.i++;examShow()">Nästa ›</button>`:''}
  <button class="btn" style="margin-left:auto" onclick="examSubmit()">Lämna in${answered<n?' ('+(n-answered)+' obesvarade)':''}</button></div>`;
  window.scrollTo(0,0);
}
function examSubmit(){
  const n=E.qs.length, answered=E.qs.filter(x=>x.ans).length;
  if(answered<n && !E.confirm){E.confirm=true;examShow();document.querySelector('.row').insertAdjacentHTML('beforeend',`<div class="fb bad" style="width:100%">${n-answered} frågor är obesvarade och räknas som fel. Tryck Lämna in igen för att lämna in ändå.</div>`);return}
  let right=0; const per={};
  E.qs.forEach(x=>{const ok=x.ans===x.q.c; if(ok)right++; else addWrong(x.q.k); per[x.q.a]=per[x.q.a]||[0,0]; per[x.q.a][1]++; if(ok)per[x.q.a][0]++});
  S.exam={right,total:n}; save();
  const pct=Math.round(100*right/n);
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button></div>
  <div class="card"><div class="eyebrow">Resultat slutprov</div><div class="big" style="margin:8px 0">${right} / ${n}</div><p>${pct}&nbsp;% rätt. ${pct>=90?'Mycket bra, du kan det här.':pct>=70?'Bra grund. Gå igenom felen under Repetera.':'Läs om de områden som gick sämst och gör provet igen.'}</p>
  <div class="stat">${AREAS.map(a=>`<div><small>${esc(a.short)}</small><b>${per[a.id]?per[a.id][0]+' / '+per[a.id][1]:'–'}</b></div>`).join('')}</div>
  <div class="row"><button class="btn" onclick="examReview()">Gå igenom svaren</button><button class="btn ghost" onclick="examBegin()">Gör om provet</button></div></div>`;
  window.scrollTo(0,0);
}
function examReview(){
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button><span class="eyebrow">Genomgång</span></div>`+E.qs.map((x,j)=>{
    const ok=x.ans===x.q.c; const a=AREAS.find(z=>z.id===x.q.a);
    return `<div class="card" style="margin-bottom:10px"><div class="eyebrow">${j+1} · ${esc(a.short)}</div><p style="font-weight:600;margin:6px 0">${esc(x.q.q)}</p>
    <div class="fb ${ok?'ok':'bad'}" style="margin-top:6px">${ok?'<b>Rätt:</b> ':'<b>Ditt svar:</b> '+esc(x.ans||'(obesvarad)')+'<br><b>Rätt svar:</b> '}${esc(x.q.c)}<br><span class="tiny">${esc(x.q.e)}</span></div></div>`}).join('')+`<div class="row"><button class="btn" onclick="home()">Till hem</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- Repetera fel ---------- */
function repeat(){
  const keys=shuffle(S.wrong.slice()); if(!keys.length)return home();
  let i=0;
  function show(){
    if(i>=keys.length){app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button></div><div class="card"><h2>Omgång klar</h2><p>${S.wrong.length?S.wrong.length+' frågor finns kvar att repetera.':'Alla fel är rättade. Listan är tom.'}</p><div class="row"><button class="btn" onclick="home()">Till hem</button>${S.wrong.length?'<button class="btn ghost" onclick="repeat()">En omgång till</button>':''}</div></div>`;return}
    const q=byKey[keys[i]]; if(!q){i++;return show()}
    const opts=shuffle([q.c,...q.w]), L='ABCD', a=AREAS.find(z=>z.id===q.a);
    app.innerHTML=`<div class="top"><button class="back" onclick="home()">‹ Hem</button><span class="eyebrow">Repetera ${i+1} av ${keys.length} · ${esc(a.short)}</span></div>
    <p class="qtext">${esc(q.q)}</p><div class="opts">${opts.map((o,j)=>`<button class="opt" data-o="${esc(o)}"><b>${L[j]}</b><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.o===q.c; if(ok)remWrong(q.k);
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===q.c)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
      document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Rätt, bort från listan.':'Fel, ligger kvar.'}</b> ${esc(q.e)}</div><div class="row"><button class="btn" id="nx">Nästa →</button></div>`;
      document.getElementById('nx').onclick=()=>{i++;show()};
    });
    window.scrollTo(0,0);
  }
  show();
}
home();
</script>
